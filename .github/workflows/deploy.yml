name: Deploy deck to GitHub Pages

# Two versions share one Pages site: main at the root, the v2 branch under
# /v2/. Only main may deploy to github-pages, so a push to v2 asks main's run
# to rebuild both instead of deploying itself.
on:
  push:
    branches: [main, v2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  hand-off:
    if: github.ref == 'refs/heads/v2'
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # vite.config.ts uses base './', so the same build works from a subfolder
      - uses: actions/checkout@v4
        with:
          ref: v2
          path: v2src
      - run: npm ci && npm run build
        working-directory: v2src
      - run: cp -R v2src/dist dist/v2

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
