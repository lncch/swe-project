name: Deploy deck to GitHub Pages

# Every version shares one Pages site: main at the root, and each branch named
# v-something under /<branch>/. Only main may deploy to github-pages, so a push
# to a version branch asks main's run to rebuild them all instead.
on:
  push:
    branches: [main, 'v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

jobs:
  hand-off:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    if: github.ref == 'refs/heads/main'
    # only the builds queue up; a hand-off must never be cancelled before it asks
    concurrency:
      group: pages
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # vite.config.ts uses base './', so the same build works from a subfolder
      - name: Build every version branch into its own folder
        run: |
          for branch in $(git ls-remote --heads origin 'v*' | sed 's#.*refs/heads/##'); do
            git worktree add "../src-$branch" "origin/$branch"
            (cd "../src-$branch" && npm ci && npm run build)
            cp -R "../src-$branch/dist" "dist/$branch"
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
